[package]
name = "laundry_maxxing"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["multipart", "json", "gzip", "deflate", "brotli", "zstd"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
strum = "0.28.0"
strum_macros = "0.28.0"
chrono = "0.4.45"
colored_text = "0.6.0"
csv = "1"
serde = { version = "1", features = ["derive"] }


